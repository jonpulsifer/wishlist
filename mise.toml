# mise is the command source of truth for this repo.
# `mise tasks ls` lists what exists; `mise run <task>` runs it.
#
# Entering the directory is enough to get a working toolchain: mise pins bun and
# node, and .mise/nix-env.sh exports the Prisma engine paths from the pinned
# flake. Nothing here needs a `nix develop` wrapper.

[tools]
bun = "1.3.14"
node = "24"
vercel = { version = "latest", allow_builds = ["esbuild"], trust_policy_excludes = ["undici"] }

[env]
# Prisma engines + $PGBIN, resolved from flake.nix on NixOS. No-op elsewhere.
_.source = ".mise/nix-env.sh"

# The local Postgres the db:* tasks manage. Matches .env.example, so
# DATABASE_URL and these agree.
PGDATA = "{{config_root}}/.pgdata"
PGHOST = "127.0.0.1"
PGPORT = "5432"
PGUSER = "postgres"
PGDATABASE = "wishlist"

# ─── Setup ───────────────────────────────────────────────────────────────────

[tasks.setup]
description = "First run: install deps, write .env, start and seed the database"
depends = ["install"]
run = '''
set -euo pipefail
if [ ! -f .env ]; then
  # AUTH_SECRET has no dev fallback — Auth.js refuses to start without one, so
  # generate it here rather than leaving a fresh clone unable to sign in.
  # bun rather than `openssl rand`, which is not on PATH on NixOS.
  secret=$(bun -e 'process.stdout.write(Buffer.from(crypto.getRandomValues(new Uint8Array(32))).toString("base64"))')
  sed "s|^AUTH_SECRET=$|AUTH_SECRET=$secret|" .env.example > .env
  echo "wrote .env from .env.example, with a generated AUTH_SECRET"
  echo "   still needed: AUTH_GOOGLE_ID and AUTH_GOOGLE_SECRET"
fi
mise run db:up
mise run db:migrate
echo "ready — 'mise run dev' to start"
'''

[tasks.install]
description = "Install dependencies"
run = "bun install"

# ─── Develop ─────────────────────────────────────────────────────────────────

[tasks.dev]
description = "Run the dev server (Turbopack) on :3000"
run = "bun run dev"

[tasks.generate]
description = "Regenerate the Prisma client into prisma/generated"
run = "bunx --bun prisma generate --no-hints"

# ─── Validate ────────────────────────────────────────────────────────────────

[tasks.lint]
description = "Biome check (read-only)"
run = "bun run lint"

[tasks."lint:fix"]
description = "Biome check with autofixes applied"
run = "bun run lint:fix"

[tasks.test]
description = "Run the lib/ unit tests"
run = "bun run test"

[tasks.typecheck]
description = "Type-check without emitting"
run = "bunx tsc --noEmit"

[tasks.check]
description = "Everything CI runs except the build — lint, types, tests"
depends = ["lint", "typecheck", "test"]

[tasks.build]
description = "Full production build (generate + migrate deploy + next build; needs a database)"
run = "bun run build"

[tasks."build:next"]
description = "next build only — no database needed, every data route is dynamic"
run = "bun run --bun next build"

# ─── Database ────────────────────────────────────────────────────────────────
# A local Postgres out of the nix store, in $PGDATA. Docker is not available on
# NixOS WSL, so there is no compose file to run instead.

[tasks."db:up"]
description = "Start the local Postgres, creating the cluster and database if needed"
run = '''
#!/usr/bin/env bash
set -euo pipefail
: "${PGBIN:?nix is required for the db:* tasks — Postgres comes from flake.nix}"

if [ ! -d "$PGDATA" ]; then
  echo "==> initdb $PGDATA"
  "$PGBIN/initdb" --username="$PGUSER" --auth=trust --pgdata="$PGDATA" >/dev/null
fi

if "$PGBIN/pg_ctl" --pgdata="$PGDATA" status >/dev/null 2>&1; then
  echo "==> postgres already running on $PGHOST:$PGPORT"
else
  "$PGBIN/pg_ctl" --pgdata="$PGDATA" --log="$PGDATA/server.log" --wait --options="-p $PGPORT -k $PGDATA -c listen_addresses=$PGHOST" start
fi

# The second database is the shadow Migrate replays the chain into; see
# prisma.config.ts.
for db in "$PGDATABASE" "${PGDATABASE}_shadow"; do
  if ! PGDATABASE=postgres "$PGBIN/psql" -lqt | cut -d'|' -f1 | grep -qw "$db"; then
    PGDATABASE=postgres "$PGBIN/createdb" "$db"
    echo "==> created database $db"
  fi
done
'''

[tasks."db:down"]
description = "Stop the local Postgres"
run = '''
#!/usr/bin/env bash
set -euo pipefail
: "${PGBIN:?nix is required for the db:* tasks — Postgres comes from flake.nix}"
if "$PGBIN/pg_ctl" --pgdata="$PGDATA" status >/dev/null 2>&1; then
  "$PGBIN/pg_ctl" --pgdata="$PGDATA" --wait stop
else
  echo "==> postgres is not running"
fi
'''

[tasks."db:migrate"]
description = "Apply pending migrations, creating one from schema.prisma if it has drifted"
# migrate dev generates only when it actually creates a migration — its
# "already in sync" path exits before the generators run, which leaves a stale
# client after an edit that turned out to be a no-op.
depends = ["generate"]
run = "bunx --bun prisma migrate dev"

[tasks."db:seed"]
description = "Fill the database with faker data"
run = "bun prisma/seed.ts"

[tasks."db:studio"]
description = "Open Prisma Studio against the local database"
run = "bunx --bun prisma studio"

[tasks."db:psql"]
description = "psql shell on the local database"
run = "$PGBIN/psql"

[tasks."db:reset"]
description = "Drop the local database and replay the migration chain from empty"
# Local data is disposable, so local environments migrate from empty rather
# than baselining the way production does. This is also the gate that proves the
# chain still applies from scratch — including any hand-edited RENAME.
run = "bunx --bun prisma migrate reset --force"
